<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>01 · Title</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .slide {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--vi-ink);
    color: var(--vi-paper);
    position: relative;
  }
  .bg-ink {
    position: absolute;
    inset: 0;
    opacity: 0.12;
    background: url('../assets/bg-ink-stroke.jpg') center/cover no-repeat;
  }
  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .badge {
    font-family: var(--font-mono);
    font-size: var(--fs-caption);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(250,250,250,0.5);
  }
  .title-main {
    font-family: var(--font-display-en);
    font-size: 80px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-ink"></div>
  <div class="content">
    <p class="badge">头号 Builder 全球挑战赛 · 北京站</p>
    <h1 class="title-main">Kiyo</h1>
    <p class="subtitle">Multi-Agent Music Creation for Global Creators</p>
    <p class="author">Wang Yiyang · 个人开发者</p>
  </div>
  <div class="vermillion-dot"></div>
</div>
<style>
  .subtitle {
    font-family: var(--font-display-en);
    font-size: var(--fs-h3);
    font-weight: 400;
    opacity: 0.7;
    letter-spacing: 0.01em;
  }
  .author {
    font-family: var(--font-body-zh);
    font-size: var(--fs-body);
    opacity: 0.4;
    margin-top: 24px;
  }
  .vermillion-dot {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--vi-vermillion);
  }
</style>
</body>
</html>
