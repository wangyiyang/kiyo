<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --bg: #0D0D12;
      --fg: #FFFFFF;
      --purple: #8B5CF6;
      --cyan: #22D3EE;
      --purple-glow: rgba(139, 92, 246, 0.22);
      --cyan-glow: rgba(34, 211, 238, 0.18);
      --muted: rgba(255, 255, 255, 0.55);
      --surface: rgba(255, 255, 255, 0.06);
      --surface-border: rgba(139, 92, 246, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
      font-family: "Space Grotesk", sans-serif;
      color: var(--fg);
    }

    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
    }

    #scene1 { z-index: 1; }
    #scene2 { z-index: 2; opacity: 0; }
    #scene3 { z-index: 3; opacity: 0; }
    #scene4 { z-index: 4; opacity: 0; }
    #scene5 { z-index: 5; opacity: 0; }

    .scene-content {
      width: 100%;
      height: 100%;
      padding: 100px 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    /* Decorative: radial glow */
    .radial-glow {
      position: absolute;
      width: 900px;
      height: 900px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--purple-glow), transparent 70%);
      pointer-events: none;
    }

    /* Decorative: ghost text */
    .ghost-text {
      position: absolute;
      font-size: 320px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.03);
      letter-spacing: -0.04em;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Mono label */
    .mono-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 16px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* Waveform bars */
    .waveform {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .wbar {
      width: 8px;
      border-radius: 4px;
      background: linear-gradient(to top, var(--purple), var(--cyan));
      transform-origin: bottom;
    }

    /* Prompt box */
    .prompt-box {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 18px 28px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      font-size: 22px;
      color: var(--muted);
    }
    .prompt-cursor {
      width: 3px;
      height: 26px;
      background: var(--cyan);
      margin-left: 4px;
    }

    /* Feature pill */
    .feature-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      font-size: 20px;
      font-weight: 500;
    }
    .feature-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
    }

    /* CTA button */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 20px 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.02em;
    }

    /* EQ bars */
    .eq-bar {
      width: 5px;
      border-radius: 3px;
      background: linear-gradient(to top, var(--purple), var(--cyan));
      transform-origin: bottom;
    }

    /* Genre tag */
    .genre-tag {
      padding: 8px 18px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      font-size: 16px;
      font-weight: 500;
      color: var(--muted);
    }

    /* Fade overlay */
    #fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      background: #000000;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }

    /* ── Scene 1 specific ── */
    .s1-glow {
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
    }
    .s1-ghost {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .s1-content {
      align-items: center;

  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    /* ═══════════════════════════════════════════════
       SCENE 1: Brand Intro (0 - 5.5s)
       ═══════════════════════════════════════════════ */

    // Ambient: radial glow breathe
    tl.fromTo("#s1-glow",
      { scale: 1 },
      { scale: 1.08, yoyo: true, repeat: 3, duration: 1.4, ease: "sine.inOut" }, 0);

    // Badge entrance
    tl.fromTo("#s1-badge",
      { y: -12, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.3);

    // Title SLAM
    tl.fromTo("#s1-title",
      { scale: 0.82, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.75, ease: "expo.out" }, 0.4);

    // Tagline
    tl.fromTo("#s1-tagline",
      { y: 25, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.9);

    // Waveform bars stagger in
    var s1bars = document.querySelectorAll("#s1-waveform .wbar");
    s1bars.forEach(function(bar, i) {
      tl.fromTo(bar,
        { scaleY: 0.3, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 1.1 + i * 0.018);
    });

    // Ambient: waveform bars pulse
    s1bars.forEach(function(bar, i) {
      tl.fromTo(bar,
        { scaleY: 0.6 },
        { scaleY: 1, yoyo: true, repeat: 7, duration: 0.55, ease: "sine.inOut" }, 1.6 + i * 0.04);
    });

    /* ═══════════════════════════════════════════════
       TRANSITION 1→2: Zoom Through (5.5s)
       ═══════════════════════════════════════════════ */
    tl.set("#scene1", { zIndex: 10 }, 5.5);
    tl.set("#scene2", { zIndex: 1 }, 5.5);
    tl.to("#scene1",
      { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in", transformOrigin: "50% 50%", overwrite: "auto" }, 5.5);
    tl.fromTo("#scene2",
      { scale: 0.5, opacity: 0, filter: "blur(8px)" },
      { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 5.65);
    tl.set("#scene1", { zIndex: "auto", visibility: "hidden" }, 5.911);
    tl.set("#scene2", { zIndex: "auto" }, 5.911);

    /* ═══════════════════════════════════════════════
       SCENE 2: AI Compose (5.5 - 12.5s)
       ═══════════════════════════════════════════════ */

    // Ambient: cyan glow drift
    tl.fromTo("#s2-glow",
      { scale: 1, x: 0 },
      { scale: 1.1, x: 30, yoyo: true, repeat: 3, duration: 1.8, ease: "sine.inOut" }, 5.5);
    
    // Eyebrow
    tl.fromTo("#s2-eyebrow",
      { y: -10, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 5.9);

    // Title from left
    tl.fromTo("#s2-title",
      { x: -55, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 6.0);

    // Subtitle
    tl.fromTo("#s2-subtitle",
      { y: 25, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 6.4);

    // Prompt box
    tl.fromTo("#s2-prompt",
      { scale: 0.92, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 6.7);

    // Cursor blink (finite)
    tl.fromTo("#s2-cursor",
      { opacity: 1 },
      { opacity: 0, yoyo: true, repeat: 9, duration: 0.25, ease: "steps(1)" }, 7.0);

    // Sound wave bars
    var s2bars = document.querySelectorAll("#s2-soundwave .wbar");
    s2bars.forEach(function(bar, i) {
      tl.fromTo(bar,
        { scaleY: 0.2, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 7.1 + i * 0.02);
    });

    // Ambient: sound wave pulse
    s2bars.forEach(function(bar, i) {
      tl.fromTo(bar,
        { scaleY: 0.55 },
        { scaleY: 1, yoyo: true, repeat: 8, duration: 0.5, ease: "sine.inOut" }, 7.8 + i * 0.035);
    });

    // Tags stagger
    tl.fromTo("#s2-tag1",
      { y: 18, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 8.3);
    tl.fromTo("#s2-tag2",
      { y: 18, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 8.45);
    tl.fromTo("#s2-tag3",
      { y: 18, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 8.6);

    /* ═══════════════════════════════════════════════
       TRANSITION 2→3: Zoom Through (12.5s)
       ═══════════════════════════════════════════════ */
    tl.set("#scene2", { zIndex: 10 }, 12.5);
    tl.set("#scene3", { zIndex: 1 }, 12.5);
    tl.to("#scene2",
      { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in", transformOrigin: "50% 50%", overwrite: "auto" }, 12.5);
    tl.fromTo("#scene3",
      { scale: 0.5, opacity: 0, filter: "blur(8px)" },
      { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 12.65);
    tl.set("#scene2", { zIndex: "auto", visibility: "hidden" }, 12.911);
    tl.set("#scene3", { zIndex: "auto" }, 12.911);

    /* ═══════════════════════════════════════════════
       SCENE 3: AI Cover (12.5 - 20.0s)
       ═══════════════════════════════════════════════ */

    // Ambient: purple glow
    tl.fromTo("#s3-glow",
      { scale: 1 },
      { scale: 1.12, yoyo: true, repeat: 3, duration: 1.9, ease: "sine.inOut" }, 12.5);
    
    // Eyebrow
    tl.fromTo("#s3-eyebrow",
      { y: -10, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 12.9);

    // Title from right
    tl.fromTo("#s3-title",
      { x: 55, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 13.0);

    // Subtitle
    tl.fromTo("#s3-subtitle",
      { y: 25, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 13.4);

    // Left waveform
    tl.fromTo("#s3-left",
      { x: -35, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 13.6);

    // Right waveform
    tl.fromTo("#s3-right",
      { x: 35, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 13.6);

    // Morph arrow
    tl.fromTo("#s3-arrow",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" }, 13.9);

    // Genre tags stagger
    var s3tags = ["#s3-tag1", "#s3-tag2", "#s3-tag3", "#s3-tag4"];
    s3tags.forEach(function(tag, i) {
      tl.fromTo(tag,
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 14.2 + i * 0.1);
    });

    // Waveform bars ambient
    var s3bars = document.querySelectorAll("#scene3 .wbar");
    s3bars.forEach(function(bar, i) {
      tl.fromTo(bar,
        { scaleY: 0.5 },
        { scaleY: 1, yoyo: true, repeat: 9, duration: 0.45, ease: "sine.inOut" }, 14.8 + (i % 8) * 0.06);
    });

    /* ═══════════════════════════════════════════════
       TRANSITION 3→4: Blur Crossfade (20.0s)
       ═══════════════════════════════════════════════ */
    tl.to("#scene3",
      { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.5, ease: "power2.inOut", overwrite: "auto" }, 20.0);
    tl.fromTo("#scene4",
      { filter: "blur(10px)", scale: 0.97, opacity: 0 },
      { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20.1);
    tl.set("#scene3", { zIndex: "auto", visibility: "hidden" }, 20.609);
    tl.set("#scene4", { zIndex: "auto" }, 20.609);

    /* ═══════════════════════════════════════════════
       SCENE 4: Smart Edit (20.0 - 27.0s)
       ═══════════════════════════════════════════════ */

    // Ambient: glow
    tl.fromTo("#s4-glow",
      { scale: 1 },
      { scale: 1.06, yoyo: true, repeat: 3, duration: 1.7, ease: "sine.inOut" }, 20.0);
    
    // Eyebrow
    tl.fromTo("#s4-eyebrow",
      { y: -10, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 20.4);

    // Title from top
    tl.fromTo("#s4-title",
      { y: -35, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 20.5);

    // Subtitle
    tl.fromTo("#s4-subtitle",
      { y: 25, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 20.9);

    // Feature pills stagger
    var pills = ["#s4-pill1", "#s4-pill2", "#s4-pill3"];
    pills.forEach(function(pill, i) {
      tl.fromTo(pill,
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 21.1 + i * 0.12);
    });

    // Ambient: pills float
    pills.forEach(function(pill, i) {
      tl.fromTo(pill,
        { y: 0 },
        { y: -6, yoyo: true, repeat: 5, duration: 1.1, ease: "sine.inOut" }, 21.8 + i * 0.15);
    });

    // EQ bars
    var s4eq = document.querySelectorAll("#s4-eq .eq-bar");
    s4eq.forEach(function(bar, i) {
      tl.fromTo(bar,
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, 21.6 + i * 0.025);
    });

    // Ambient: EQ pulse
    s4eq.forEach(function(bar, i) {
      tl.fromTo(bar,
        { scaleY: 0.5 },
        { scaleY: 1, yoyo: true, repeat: 8, duration: 0.4, ease: "sine.inOut" }, 22.2 + (i % 5) * 0.05);
    });

    /* ═══════════════════════════════════════════════
       TRANSITION 4→5: Color Dip (27.0s)
       ═══════════════════════════════════════════════ */
    tl.to("#scene4",
      { opacity: 0, duration: 0.2, ease: "power2.in", overwrite: "auto" }, 27.0);
    tl.fromTo("#scene5",
      { opacity: 0 },
      { opacity: 1, duration: 0.2, ease: "power2.out" }, 27.25);
    tl.set("#scene4", { zIndex: "auto", visibility: "hidden" }, 27.46);
    tl.set("#scene5", { zIndex: "auto" }, 27.46);

    /* ═══════════════════════════════════════════════
       SCENE 5: CTA (27.0 - 35.0s)
       ═══════════════════════════════════════════════ */

    // Ambient: strong glow pulse
    tl.fromTo("#s5-glow",
      { scale: 0.95 },
      { scale: 1.15, yoyo: true, repeat: 3, duration: 2.0, ease: "sine.inOut" }, 27.0);

    // Title
    tl.fromTo("#s5-title",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.85, ease: "expo.out" }, 27.3);

    // URL
    tl.fromTo("#s5-url",
      { y: 15, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 27.9);

    // CTA button
    tl.fromTo("#s5-cta",
      { y: 25, scale: 0.95, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 28.3);

    // Ambient: CTA button glow
    tl.fromTo("#s5-cta .cta-btn",
      { boxShadow: "0 0 0px rgba(139,92,246,0)" },
      { boxShadow: "0 0 60px rgba(139,92,246,0.5)", yoyo: true, repeat: 3, duration: 1.8, ease: "sine.inOut" }, 29.0);

    /* ═══════════════════════════════════════════════
       FINAL FADE TO BLACK (33.5s)
       ═══════════════════════════════════════════════ */
    tl.to("#s5-title, #s5-url, #s5-cta",
      { opacity: 0, y: -15, duration: 0.6, ease: "power2.in" }, 33.5);
    tl.to("#fade-overlay",
      { opacity: 1, duration: 1.2, ease: "power2.in" }, 33.8);

    // Hard-kill scene5 after final fade
    tl.set("#scene5", { visibility: "hidden" }, 35.011);

    // Register timeline
    window.__timelines["kiyo-promo"] = tl;
  </script>
</body>
</html>
